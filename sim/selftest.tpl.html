<meta charset="utf-8">
<title>SV20 — самотест физики</title>
<style>
 body{font:13px/1.5 ui-monospace,Menlo,monospace;background:#0e1116;color:#dde3ea;padding:18px}
 table{border-collapse:collapse} td{padding:2px 10px 2px 0}
 .bad{color:#ff6b8a} .ok{color:#6ee7a8}
 h1{font-size:15px;margin:0 0 12px}
</style>
<h1>Самотест физики: модель прогоняется без сцены и без цикла кадров</h1>
<div id="out">считаю…</div>
<script type="module">
const PACK = /*__PACK__*/ null;
{
/*__PHYSICS__*/

const D = Math.PI / 180;
const rows = [];
const cases = [
  ['крутой бейдевинд', 45, 14],
  ['галфвинд',         90, 24],
  ['бакштаг',         135, 45],
  ['фордевинд',       178, 80],
];
let bad = 0;
for (const [name, twa, sheet] of cases) {
  const b = new Boat(PACK);
  b.o.windSpeed = 6.0;
  b.o.windDir = twa * D;      // курс ноль, значит истинный ветер равен twa
  b.o.sheet = sheet * D;
  b.o.rudder = 0;
  let t = null;
  for (let i = 0; i < 90 * 30; i++) t = b.step(1 / 30);
  const finite = [b.u, b.v, b.r, b.phi, b.psi].every(Number.isFinite);
  if (!finite) bad++;
  rows.push([name, twa, sheet, t, b, finite]);
}

// поворот руля: лодка должна отзываться и не разгоняться по рысканию
const turn = new Boat(PACK);
turn.o.windSpeed = 6; turn.o.windDir = 90 * D; turn.o.sheet = 24 * D;
for (let i = 0; i < 60 * 30; i++) turn.step(1 / 30);
const psi0 = turn.psi;
turn.o.rudder = 15 * D;
for (let i = 0; i < 10 * 30; i++) turn.step(1 / 30);
const turned = (turn.psi - psi0) / D;

const fmt = (v, p) => Number.isFinite(v) ? v.toFixed(p) : '—';
let html = '<table><tr><td>курс</td><td>TWA</td><td>шкот</td><td>узлы</td>' +
  '<td>крен</td><td>дрейф</td><td>AWA</td><td>тяга, Н</td><td>конечно</td></tr>';
for (const [name, twa, sheet, t, b, finite] of rows) {
  html += '<tr><td>' + name + '</td><td>' + twa + '°</td><td>' + sheet + '°</td>' +
    '<td>' + fmt(t.speedKn, 2) + '</td><td>' + fmt(t.heelDeg, 1) + '°</td>' +
    '<td>' + fmt(t.leewayDeg, 1) + '°</td><td>' + fmt(t.awaDeg, 0) + '°</td>' +
    '<td>' + fmt(t.driveN, 0) + '</td><td class="' + (finite ? 'ok' : 'bad') +
    '">' + (finite ? 'да' : 'НЕТ') + '</td></tr>';
}
html += '</table>';
html += '<p>Руль 15° десять секунд: курс изменился на <b>' + turned.toFixed(0) +
  '°</b>, скорость рыскания ' + (turn.r / D).toFixed(1) + ' °/с.</p>';
html += '<p class="' + (bad ? 'bad' : 'ok') + '">Расходимостей: ' + bad + '</p>';
document.getElementById('out').innerHTML = html;
}
</script>
