<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV20 — акватория</title>
<style>
  :root {
    --panel: rgba(16, 22, 30, .82); --fg: #e6edf4; --dim: #93a3b4;
    --line: rgba(255, 255, 255, .12); --accent: #ffcf5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #9fb6c9; color: var(--fg);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #crash {
    display: none; position: fixed; inset: 0 0 auto 0; z-index: 9;
    padding: 10px 14px; background: #7a1730; color: #fff;
    font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap;
  }
  .card {
    position: fixed; background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  #info { top: 14px; left: 14px; width: 268px; }
  #info h1 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
  #info .sub { color: var(--dim); font-size: 11.5px; margin-bottom: 10px; }
  #info table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #info td { padding: 2px 0; }
  #info td.v { text-align: right; font-variant-numeric: tabular-nums; }
  #panel { top: 14px; right: 14px; width: 236px; }
  #panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 0 0 8px; font-weight: 600;
  }
  #panel label { display: block; margin-bottom: 9px; }
  #panel .cap {
    display: flex; justify-content: space-between; font-size: 11.5px;
    margin-bottom: 2px;
  }
  #panel .cap span:last-child {
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  #panel input[type=range] { width: 100%; }
  #panel .check { display: flex; gap: 7px; align-items: center; font-size: 12px; }
  #modes { display: flex; gap: 6px; margin-bottom: 12px; }
  #modes button {
    flex: 1; padding: 5px 0; cursor: pointer; font: inherit; font-size: 12px;
    background: rgba(255, 255, 255, .07); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
  }
  #modes button.on { background: var(--accent); color: #16202b; border-color: transparent; }
  #hint {
    display: none; position: fixed; left: 50%; bottom: 18px;
    transform: translateX(-50%); font-size: 12px; color: var(--fg);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px;
  }
  #hint em { color: var(--accent); font-style: normal; }
  #credit {
    position: fixed; left: 14px; bottom: 14px; max-width: 420px;
    font-size: 10.5px; line-height: 1.6; color: rgba(255, 255, 255, .72);
    text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
  }
</style>

<div id="stage"></div>
<pre id="crash"></pre>

<div class="card" id="info">
  <h1>Речная акватория</h1>
  <div class="sub">Волга ниже стрелки с Окой — выгрузка из открытых источников</div>
  <table><tbody id="facts"></tbody></table>
</div>

<div class="card" id="panel">
  <h2>Просмотр</h2>
  <div id="modes">
    <button data-mode="orbit">Облёт</button>
    <button data-mode="eye">С воды</button>
  </div>
  <label>
    <div class="cap"><span>Подъём высот</span><span id="v-exag"></span></div>
    <input type="range" id="exag" min="1" max="8" step="0.5" value="1">
  </label>
  <label>
    <div class="cap"><span>Солнце</span><span id="v-sunaz"></span></div>
    <input type="range" id="sunaz" min="0" max="360" step="5" value="315">
  </label>
  <label class="check"><input type="checkbox" id="cover" checked> Лес и застройка</label>
  <label class="check"><input type="checkbox" id="banded"> Ступенями по 10 м</label>
  <label class="check"><input type="checkbox" id="grid" checked> Сетка 1 км</label>
</div>

<div id="hint">
  <em>WASD</em> — ход, <em>Shift</em> — быстрее, мышь — осмотреться,
  <em>пробел</em> — назад к облёту
</div>

<div id="credit"></div>
